<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Avenor Digital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="logo">Avenor Digital</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Contact Heading -->
    <section class="page-hero">
        <p class="hero-tag">LET'S CONNECT</p>
        <h1>Contact Us</h1>
        <p>Have a project in mind? We'd love to hear from you. Let's discuss how we can help your business grow.</p>
    </section>

    <!-- Contact Section -->
    <section class="contact">
        <div class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="https://formspree.io/f/xoeeyvqz" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                
                <input type="email" name="email" placeholder="Your Email" required>
                
                <input type="text" name="subject" placeholder="Subject" required>
                
                <textarea name="message" placeholder="Tell us about your project..." rows="6" required></textarea>
                
                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Avenor Digital. All rights reserved.</p>
    </footer>

</body>
</html>
